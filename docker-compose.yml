services:
  db:
    image: postgis/postgis:15-3.3
    container_name: quad_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=quad_trading
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quad_trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - quad_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: quad_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: quad_backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ml:/app/ml
      - stock_data:/app/data
    environment:
      - USE_SQLITE=false
      - SQLITE_DB_PATH=/app/data/stock_data.db
      - OPENALGO_WS_URL=ws://openalgo:8765
      - OPENALGO_API_URL=http://openalgo:5000/api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: /venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    container_name: quad_worker
    env_file: .env
    depends_on:
      - db
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./ml:/app/ml
      - stock_data:/app/data
    environment:
      - USE_SQLITE=false
      - SQLITE_DB_PATH=/app/data/stock_data.db
    command: /venv/bin/python -m celery -A app.workers.celery_app worker --loglevel=info

  frontend:
    build: 
      context: ./frontend-new
      dockerfile: Dockerfile
    container_name: quad_frontend
    ports:
      - "3010:3000"
    env_file: .env
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_healthy

  openalgo:
    build:
      context: ./openalgo
      dockerfile: Dockerfile
    container_name: openalgo-web
    ports:
      - "5000:5000"
      - "8765:8765"
    volumes:
      - openalgo_db:/app/db
      - openalgo_logs:/app/logs
      - openalgo_strategies:/app/strategies
      - openalgo_keys:/app/keys
      - ./openalgo/.env:/app/.env:ro
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    restart: unless-stopped

volumes:
  quad_db_data:
  stock_data:
  openalgo_db:
  openalgo_logs:
  openalgo_strategies:
  openalgo_keys:
